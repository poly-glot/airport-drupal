      slot: parts
      uuid: 03579bf7-9acb-48c8-95c2-ed43e961a4d9
      component_id: js.prose
      inputs:
        body: |-
          <h2 id="report-a-problem-title">Report a problem</h2>
          <p>If you find something on this website that does not work for you, tell us. Say which page, what you were trying to do, and what device and assistive technology you use.</p>
          <ul><li>Email: <a href="mailto:hello@meridianairport.example">hello@meridianairport.example</a></li><li>Phone: <a href="tel:+441214960123">0121 496 0123</a>, every day 05:00–23:00</li><li>Post: Meridian Airport, Skyline Way, Birmingham B99 1MA</li></ul>
          <p>We will reply within 5 working days. If you need information from this website in another format, such as large print or audio, ask and we will send it within 10 working days.</p>
