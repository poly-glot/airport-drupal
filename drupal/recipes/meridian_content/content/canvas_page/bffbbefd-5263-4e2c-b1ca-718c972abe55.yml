      component_id: js.prose
      inputs:
        body: |-
          <h2 id="conformance-status-title">Conformance status</h2>
          <p>This website is designed to conform fully to the Web Content Accessibility Guidelines (WCAG) version 2.2 at level AA. Where we know of a limitation, we list it below.</p>
    -
      uuid: 5163baa3-6d58-443c-9e2a-adb34dc9a0a0
      component_id: js.section
      inputs:
        anchor: what-we-have-done
        tone: light
        tag: section
        labelledBy: what-we-have-done-title
        headingLevel: h2
    -
      parent_uuid: 5163baa3-6d58-443c-9e2a-adb34dc9a0a0
      slot: parts
      uuid: a54b9718-af97-4e14-950f-a88a3d389202
      component_id: js.prose
      inputs:
        body: |-
          <h2 id="what-we-have-done-title">What we have done</h2>
          <ul><li>Every page has one main heading, headings in order, and landmarks for the header, navigation, main content and footer.</li><li>Text and interactive elements meet the AA colour contrast ratios. We calculated every colour pair rather than judging by eye.</li><li>Flight statuses use a word as well as a coloured dot, so nothing relies on colour alone.</li><li>Every form field has a visible label, and optional fields are marked in words.</li><li>Main buttons and links are at least 44 by 44 pixels, and every other control is at least 24 by 24 pixels.</li><li>Maps and illustrations that carry information have a text description. Decorative images are hidden from screen readers.</li><li>Photographs have alternative text that describes what they show.</li><li>Tables have header cells, so screen readers announce the column for each value.</li><li>Links make sense on their own. Where the visible text is short, such as "Read more", hidden text adds the context.</li></ul>
    -
      uuid: 01488df8-d083-4e4d-bdae-ec520fcadade
      component_id: js.section
      inputs:
        anchor: how-we-tested
        tone: light
        tag: section
        labelledBy: how-we-tested-title
        headingLevel: h2
    -
      parent_uuid: 01488df8-d083-4e4d-bdae-ec520fcadade
      slot: parts
      uuid: 0928fab5-d970-47b3-b47b-1e33c1dd6776
      component_id: js.prose
      inputs:
        body: |-
          <h2 id="how-we-tested-title">How we tested</h2>
          <p>We tested this website on 3 October 2026. Every page was:</p>
          <ul><li>checked with an automated HTML validator</li><li>checked with an automated accessibility tool against WCAG 2.2 level AA</li><li>checked by hand with a keyboard only, at desktop and mobile widths, in an up-to-date desktop browser</li></ul>
          <p>Automated tools cannot find every problem, so we also reviewed headings, link text, focus order and form errors by hand.</p>
    -
      uuid: e75fca53-4822-4315-beb4-86a482a5911b
      component_id: js.section
      inputs:
        anchor: known-limitations
        tone: light
        tag: section
        labelledBy: known-limitations-title
        headingLevel: h2
    -
      parent_uuid: e75fca53-4822-4315-beb4-86a482a5911b
      slot: parts
      uuid: ea02e4d4-049a-4aca-906d-45812d3eb2a4
      component_id: js.prose
      inputs:
        body: |-
          <h2 id="known-limitations-title">Known limitations</h2>
          <ul><li><strong>Live information.</strong> The flight board plays a short, scripted set of gate and status changes when the page opens, then stops. Screen readers announce each change. Security wait times and travel notices are a fixed example and do not update.</li><li><strong>Schematic maps.</strong> The airport and terminal maps are simplified drawings. The same information is given in the text next to each map.</li><li><strong>Demonstration forms.</strong> Forms on this site do not send what you type anywhere. Required fields are checked by your browser, so the wording of those messages depends on the browser you use.</li><li><strong>Links to other sites.</strong> Some links, such as airline booking and social media links, go nowhere in this demonstration. They are marked as not available.</li></ul>
    -
      uuid: 0bbe358a-ad94-4d21-8012-c4155072cda3
      component_id: js.section
