      uuid: 3da43d35-5527-47aa-9422-e7688cbc0ed6
      component_id: js.prose
      inputs:
        body: |-
          <h2 id="using-this-website-title">Using this website</h2>
          <p>We want as many people as possible to be able to use this website. You should be able to:</p>
          <ul><li>zoom in up to 400% without text spilling off the screen or content being lost</li><li>use the whole site with a keyboard only, with a visible focus outline on every link, button and form field</li><li>navigate with a screen reader, using headings, landmarks and a skip link to the main content</li><li>use the site with JavaScript turned off, including the flight board and travel notices</li><li>turn off animation, using your device's reduced motion setting</li></ul>
          <p>For help at the airport itself, see Special assistance.</p>
          <p><a href="/help/special-assistance">Special assistance</a></p>
    -
      uuid: 81c84ca7-95dc-4357-8253-d95b05b239eb
