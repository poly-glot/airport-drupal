      component_id: js.prose
      inputs:
        body: |-
          <h2 id="lost-property-title">Lost property</h2>
          <h3>Left something in the terminal, a car park or a shuttle bus?</h3>
          <p>Report it using the form below. We keep everything handed in for 30 days and check reports against it every day. If we find a match, we will email you.</p>
          <h3>Left something on the aircraft?</h3>
          <p>Contact your airline. Items found on aircraft are handled by the airline, not by us.</p>
          <h3>Collecting your item</h3>
          <p>The lost property office is in the Terminal 1 arrivals hall, next to the taxi rank. It is open every day from 08:00 to 20:00. Bring photo ID. We can also post items to you for £12 within the UK.</p>
