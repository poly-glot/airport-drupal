      component_id: js.prose
      inputs:
        body: |-
          <h2 id="oversized-and-special-items-title">Oversized and special items</h2>
          <p>Pushchairs, car seats and wheelchairs travel free on all four airlines. Take pushchairs to the gate. Drop off skis, golf clubs, bikes and other large items at the oversized baggage desk: check-in zone C in Terminal 1 or zone F in Terminal 2.</p>
    -
      uuid: 18073854-0e0b-45fc-9edd-0be1a7005f8d
      component_id: js.section
