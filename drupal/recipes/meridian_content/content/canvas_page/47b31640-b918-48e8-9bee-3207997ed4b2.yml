    -
      parent_uuid: 18073854-0e0b-45fc-9edd-0be1a7005f8d
      slot: parts
      uuid: ae4a2c0c-6bb2-4bd8-a3d5-baa637f491bf
      component_id: js.prose
      inputs:
        body: |-
          <h2 id="if-your-bag-does-not-arrive-title">If your bag does not arrive</h2>
          <ol><li>Do not leave the baggage hall.</li><li>Go to your airline's baggage desk, next to the belts.</li><li>Show your boarding pass and baggage tag.</li><li>Keep the reference number you are given. Your airline will deliver the bag once it is found.</li></ol>
          <p>If your bag is damaged, report it at the same desk before you leave. Airlines usually need damage reported within 7 days.</p>
    -
