      component_id: js.prose
      inputs:
        body: |-
          <h2 id="packing-your-bags-title">Packing your bags</h2>
          <h3>What goes in the hold</h3>
          <p>Put large liquids, sharp items, tools and sports equipment in your hold bag. Label every bag inside and out with your name and a phone number.</p>
          <h3>What stays with you</h3>
          <p>Keep medicines, keys, valuables, travel documents and anything with a lithium battery in your hand luggage. Power banks and spare batteries are not allowed in the hold.</p>
          <h3>Liquids</h3>
          <p>In Terminal 1, liquids in containers up to 2 litres can stay in your bag. In Terminal 2, liquids must be 100 ml or less, in one clear bag that you take out at security.</p>
          <p><a href="/at-the-airport/security">Full security rules</a></p>
    -
