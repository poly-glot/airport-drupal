      uuid: d65ed48f-64d0-457c-bdd5-430224c3d71a
      component_id: js.prose
      inputs:
        body: |-
          <p>Meridian Air flies to Lisbon twice a day from Terminal 1. The morning flight, MA 204, leaves at 10:05 and lands at 12:50 local time, so you can be eating lunch by the river the same afternoon. Lisbon is on the same time as the UK all year.</p>
          <p>From Lisbon airport, the metro reaches the city centre in about 25 minutes with one change. A taxi takes around 20 minutes outside rush hour. Buy a rechargeable travel card at the metro station. It works on the metro, buses, trams and the city's lifts and funiculars.</p>
