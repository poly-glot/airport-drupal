    -
      parent_uuid: 60c8bfae-c771-40b4-9be2-3a91b0409f7a
      slot: parts
      uuid: 5d83685b-dc5f-4dc9-ae8e-5fd7aa850727
      component_id: js.prose
      inputs:
        body: '<ul><li><strong>The tram.</strong> The old yellow tram that winds through Alfama and Graça is worth the queue. Get on at the first stop, early in the morning, to get a seat.</li><li><strong>The viewpoints.</strong> Lisbon is built on seven hills, and each one has a viewpoint, called a miradouro. Climb to the castle walls for the widest view, or to Graça at sunset.</li><li><strong>Belém.</strong> Take the tram or a train west along the river to see the monastery, the riverside tower and the monument to the explorers. Allow half a day.</li><li><strong>Alfama.</strong> The oldest district, a maze of stairs and alleys below the castle. Go without a plan and let yourself get lost.</li></ul>'
