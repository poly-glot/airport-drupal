        size: sm
    -
      parent_uuid: ba903332-1355-4ba6-bdf8-01d96146207a
      slot: parts
      uuid: 09bf5153-7722-4b5b-97af-92e10c264337
      component_id: js.prose
      inputs:
        body: |-
          <p>Lisbon eats late. Lunch runs from about 13:00 to 15:00 and few people sit down to dinner before 20:00.</p>
          <ul><li><strong>Custard tarts.</strong> Eat them warm, with cinnamon and a short, strong coffee. Every neighbourhood bakery makes its own, and most are as good as the famous ones.</li><li><strong>Grilled sardines.</strong> Best from June to September, cooked outside on charcoal and served on bread. Out of season, try grilled sea bream or octopus instead.</li><li><strong>Pork sandwiches.</strong> Thin slices of pork marinated in garlic and wine, in a soft roll. A cheap, quick lunch at any counter café.</li><li><strong>Tascas.</strong> Small, family-run restaurants with a handwritten menu and a dish of the day. Expect to pay around €12 to €15 for a main course and a glass of wine.</li></ul>
          <p>The bread, olives and cheese put on your table when you sit down are not free. If you do not want them, say so and they will be taken away.</p>
