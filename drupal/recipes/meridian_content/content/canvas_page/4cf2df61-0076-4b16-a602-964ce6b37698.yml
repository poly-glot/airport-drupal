        level: h2
        id: practical-tips-title
        size: sm
    -
      parent_uuid: 29e3f9c9-3846-484a-8793-89c34ccd0b8b
      slot: parts
      uuid: d2ba4b49-63b7-42ea-b69c-d21c6956b4c0
      component_id: js.prose
      inputs:
        body: |-
          <ul><li><strong>Shoes.</strong> The pavements are polished limestone and very slippery when wet. Wear shoes with grip.</li><li><strong>Money.</strong> Portugal uses the euro. Cards are accepted almost everywhere, but carry a few coins for trams and small cafés.</li><li><strong>Hills.</strong> If walking up is hard, the city's lifts and funiculars cover the steepest climbs and take the same travel card.</li><li><strong>Pickpockets.</strong> Keep your bag in front of you on crowded trams.</li><li><strong>Weather.</strong> October is usually warm and dry, around 22°C, with the odd heavy shower. Pack a light jacket for the evening.</li></ul>
          <p><a href="/flights">Check Lisbon flights</a></p>
