      component_id: js.prose
      inputs:
        body: |-
          <h2 id="before-you-leave-home-title">Before you leave home</h2>
          <p>Plan to be at the terminal 2 hours before a short-haul flight and 3 hours before a long-haul one. Check which terminal you fly from: Meridian Air uses Terminal 1, and Nordvik, Azur Express and Kestrel use Terminal 2.</p>
          <p>Times below are for today, updated 09:42.</p>
    -
      uuid: 1c6854b4-ee7c-4707-81c2-885fe9a66208
      component_id: js.section
      inputs:
        anchor: five-steps-to-the-gate
        tone: light
        tag: section
        labelledBy: five-steps-to-the-gate-title
        headingLevel: h2
    -
      parent_uuid: 1c6854b4-ee7c-4707-81c2-885fe9a66208
      slot: parts
      uuid: b2604f55-f313-4662-9f3d-7395dfc122a2
      component_id: js.prose
      inputs:
        body: |-
          <h2 id="five-steps-to-the-gate-title">Five steps to the gate</h2>
          <ol><li><strong>Check in.</strong> Most airlines let you check in online from 24 hours before, and your boarding pass goes on your phone. If you cannot, go to your airline's desk in the check-in hall. Today: about 2 minutes online, or 10 minutes at a desk.</li><li><strong>Drop your bag.</strong> If you have a hold bag, take it to your airline's bag drop. It closes 45 minutes before departure. Today: about 10 minutes.</li><li><strong>Go through security.</strong> Put your coat, belt and anything in your pockets in a tray. In Terminal 1, liquids and laptops stay in your bag. In Terminal 2, take out your clear bag of liquids and your laptop. Today: 8 minutes in Terminal 1, 22 minutes in Terminal 2.</li><li><strong>Wait in the departure lounge.</strong> Find a seat, eat, shop or rest. Your gate number appears on the screens 60 minutes before departure.</li><li><strong>Go to the gate.</strong> Walk there as soon as your gate shows. The furthest gates in Terminal 2 are 15 minutes away. Gates close 20 minutes before departure.</li></ol>
          <p><a href="/flights">Live flights</a></p>
    -
