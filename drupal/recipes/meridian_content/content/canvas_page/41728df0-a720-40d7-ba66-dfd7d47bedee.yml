      slot: parts
      uuid: edf849d0-ce65-4eef-b2f1-1c60245e8e67
      component_id: js.prose
      inputs:
        body: |-
          <h2 id="what-you-can-carry-title">What you can carry</h2>
          <p>Each airline sets its own cabin bag size, so check your booking. Keep medicines, keys, valuables and anything with a lithium battery, such as a power bank, with you. Put large liquids, sharp items and tools in your hold bag.</p>
          <p><a href="/help/baggage-and-lost-property#allowances">Baggage allowances</a></p>
    -
      uuid: 7611bb90-c959-4c86-b67a-58a0b23094be
