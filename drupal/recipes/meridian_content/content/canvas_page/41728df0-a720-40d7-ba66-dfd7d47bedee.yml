      uuid: 8ed7d044-c079-447f-b48c-a9c187908a51
      component_id: js.prose
      inputs:
        body: |-
          <h2 id="who-to-ask-title">Who to ask</h2>
          <p>Information desks are in both check-in halls and both departure lounges, open from the first flight to the last. Any member of staff will point you the right way. If flying makes you anxious, wear a sunflower lanyard, free from any assistance desk, and we will give you more time.</p>
          <p><a href="/help/special-assistance">Special assistance</a></p>
