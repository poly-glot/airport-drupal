      component_id: js.prose
      inputs:
        body: |-
          <h2 id="what-to-bring-title">What to bring</h2>
          <ul><li>Your passport, valid for your whole trip, and any visa you need</li><li>Your boarding pass, on your phone or printed</li><li>Your booking reference, in case you need to speak to your airline</li></ul>
    -
      uuid: 7d457963-e5a1-4bf1-87b9-c5692e9db874
