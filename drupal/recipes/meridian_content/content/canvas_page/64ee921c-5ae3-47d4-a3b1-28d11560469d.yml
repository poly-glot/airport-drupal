      component_id: js.heading
      inputs:
        text: 'Assistance lane'
        level: h2
        id: assistance-lane-title
        size: sm
    -
      parent_uuid: d0d216f8-36cd-4e7d-ab31-60800e243b01
      slot: parts
      uuid: ac95d276-a0f4-4e9e-aaac-a889d781a82a
      component_id: js.prose
      inputs:
        body: |-
          <p>Both terminals have an assistance lane at security. It is calmer, staff will take their time, and you can ask for help with trays and bags. You do not need to book. Just show a sunflower lanyard or tell a member of staff.</p>
          <p><a href="/help/special-assistance">Special assistance</a></p>
    -
