      component_id: js.heading
      inputs:
        text: 'Things you cannot take in hand luggage'
        level: h2
        id: things-you-cannot-take-in-hand-luggage-title
        size: sm
    -
      parent_uuid: 90f5f981-8886-4270-ae92-f7b4e3390686
      slot: parts
      uuid: 09c223df-0ab1-4dfe-8269-c843970857a8
      component_id: js.prose
      inputs:
        body: |-
          <ul><li>Knives, scissors with blades longer than 6 cm, and tools</li><li>Sports bats, clubs and walking poles</li><li>Lighter fluid, fireworks and flammable gas</li><li>Toy or replica guns</li></ul>
          <p>If you are not sure, put it in your hold bag or leave it at home. Items taken at security cannot be returned.</p>
    -
