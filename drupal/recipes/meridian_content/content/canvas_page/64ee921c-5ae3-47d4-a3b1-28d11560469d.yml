      component_id: js.heading
      inputs:
        text: 'Things you can take'
        level: h2
        id: things-you-can-take-title
        size: sm
    -
      parent_uuid: b31d73a1-de57-4f91-9f43-f25364f5f16e
      slot: parts
      uuid: bf7fb22b-54fc-4368-804e-2be0d8506694
      component_id: js.prose
      inputs:
        body: |-
          <h3>Medicines</h3>
          <p>Essential medicines are allowed in any quantity you need for the trip, including liquids above the limit. Carry them in their original packaging with a copy of your prescription or a letter from your doctor. Tell the security officer before your bag goes through.</p>
          <h3>Baby food and milk</h3>
          <p>You can take enough baby food, milk and sterilised water for the journey. You may be asked to taste it or open it for a test.</p>
          <h3>Mobility aids and medical devices</h3>
          <p>Wheelchairs, walking sticks and medical devices go through with you. If you cannot walk through the scanner, ask for a hand search in a private room.</p>
    -
