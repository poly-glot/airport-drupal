      parent_uuid: 21838408-ecd8-4566-8372-c0c5ec99b4c6
      slot: parts
      uuid: 1841322e-1698-4c2f-92d2-6488b48a9ca7
      component_id: js.heading
      inputs:
        text: 'Liquids and laptops'
        level: h2
        id: liquids-and-laptops-title
        size: sm
    -
      parent_uuid: 21838408-ecd8-4566-8372-c0c5ec99b4c6
      slot: parts
      uuid: 826df112-b02e-44a4-beb2-ed09d3f0249b
      component_id: js.prose
      inputs:
        body: |-
          <p>The rules are different in each terminal.</p>
          <h3>Terminal 1</h3>
          <p>New scanners mean you can leave liquids and laptops in your bag.</p>
          <ul><li>Liquids can be in containers of up to 2 litres each.</li><li>Laptops, tablets and cameras can stay in your bag.</li><li>Take off your coat and belt, and empty your pockets into the tray.</li></ul>
          <h3>Terminal 2</h3>
          <p>The old rules still apply in Terminal 2 until new lanes open by spring 2027.</p>
          <ul><li>Liquids must be in containers of 100 ml or less.</li><li>Put them all in one clear, resealable bag, about 20 cm by 20 cm.</li><li>Take the bag of liquids and any laptop or large tablet out of your hand luggage and put them in a tray on their own.</li></ul>
          <h3>What counts as a liquid</h3>
          <p>Drinks, soups, sauces, creams, gels, pastes, sprays, lip gloss, mascara and anything else that pours, spreads or squeezes.</p>
    -
