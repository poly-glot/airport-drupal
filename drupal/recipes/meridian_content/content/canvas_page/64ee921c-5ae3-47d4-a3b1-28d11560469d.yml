      inputs:
        text: 'Arriving: passport control and customs'
        level: h2
        id: arriving-passport-control-and-customs-title
        size: sm
    -
      parent_uuid: dedb10de-c9e1-4990-8719-78784750e3f1
      slot: parts
      uuid: 34a6d731-16a3-43cd-ae61-f476913a0ff7
      component_id: js.prose
      inputs:
        body: |-
          <h3>Passport control</h3>
          <p>Have your passport ready as you leave the aircraft. Eligible passport holders can use the automatic gates. Everyone else, and anyone travelling with young children, should use the staffed desks.</p>
          <h3>Customs</h3>
          <p>After baggage reclaim you walk through customs.</p>
          <ul><li>Green channel: you have nothing to declare.</li><li>Red channel: you have goods over your allowance, or goods that are banned or restricted.</li></ul>
          <p>Customs allowances are set by the government, not the airport. Check the official guidance before you buy anything abroad. If you are unsure, use the red channel and ask.</p>
