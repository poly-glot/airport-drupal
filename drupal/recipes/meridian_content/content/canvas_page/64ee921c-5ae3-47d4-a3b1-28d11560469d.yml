    -
      parent_uuid: ef931a5f-9e35-4d21-afcc-d9e6795e4fb0
      slot: parts
      uuid: cd0c81da-f396-46e6-8aa4-fd6febf0276f
      component_id: js.prose
      inputs:
        body: '<p>Fast Track has its own lane in both terminals. It costs £7 per person when booked at least 24 hours ahead, or £8 at the entrance on the day. It is free for passengers booked with special assistance and up to two companions.</p>'
    -
