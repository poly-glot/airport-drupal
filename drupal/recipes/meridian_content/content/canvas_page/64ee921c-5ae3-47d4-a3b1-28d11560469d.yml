        text: 'How early to arrive'
        level: h2
        id: how-early-to-arrive-title
        size: sm
    -
      parent_uuid: b36c3c5e-5fbe-4409-89ec-fba0be7095a8
      slot: parts
      uuid: be7f8155-933f-43f6-b225-aeb71ecfc006
      component_id: js.prose
      inputs:
        body: |-
          <p>Be at the terminal 2 hours before your flight.</p>
          <ul><li>Bag drop closes 45 minutes before departure.</li><li>Security can take up to 30 minutes at busy times.</li><li>Gates close 20 minutes before departure.</li></ul>
          <p>Security is busiest from 05:00 to 07:30, and on Friday and Sunday mornings. Live wait times for both terminals are on our homepage.</p>
          <p><a href="/">Live wait times</a></p>
    -
      uuid: 8b77d4b9-6005-48e3-85ef-e58027086125
