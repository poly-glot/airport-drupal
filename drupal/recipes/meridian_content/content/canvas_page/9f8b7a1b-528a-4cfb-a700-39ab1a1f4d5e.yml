      uuid: 4533b7c0-161a-4368-b37d-9bc893fcc933
      component_id: js.prose
      inputs:
        body: |-
          <p>You can order from 30 days before you fly until 3 hours before your flight. There is no charge to reserve. You pay when you collect.</p>
          <h3>How it works</h3>
          <ol><li>Choose your items and enter your flight number and date.</li><li>We set your order aside, packed and labelled.</li><li>After security, show your boarding pass at the Reserve and Collect desk inside Meridian Duty Free.</li><li>Pay and take your bag to the gate.</li></ol>
          <p>If your plans change, do nothing. We put unclaimed orders back on the shelves after 24 hours.</p>
          <h3>What you can reserve</h3>
          <p>Perfume, beauty, spirits, wine, chocolate and sunglasses. You cannot reserve tobacco.</p>
          <p><button class="button button--secondary" type="button" disabled="">Reserve duty free<span class="visually-hidden"> (not available in this demonstration)</span></button></p>
