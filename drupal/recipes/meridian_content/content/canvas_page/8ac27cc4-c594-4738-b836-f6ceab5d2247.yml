    -
      parent_uuid: 9ac2b18f-e9cf-455d-aac9-91c496d08de7
      slot: parts
      uuid: 73a54eeb-548f-40ca-8dbb-5569df81a5db
      component_id: js.prose
      inputs:
        body: |-
          <p>Skip the main security queue. Fast Track has its own lane in both terminals and costs £7 per person when booked at least 24 hours ahead, or £8 at the entrance on the day. Book it on its own or with a lounge.</p>
          <p><a href="/at-the-airport/security">How security works</a></p>
          <p><button class="button button--secondary" type="button" disabled="">Book Fast Track<span class="visually-hidden"> (not available in this demonstration)</span></button></p>
    -
