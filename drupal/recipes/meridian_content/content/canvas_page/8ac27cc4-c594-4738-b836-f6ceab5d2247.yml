        size: sm
    -
      parent_uuid: 8315c0ce-fbe6-404e-8c45-15b315413773
      slot: parts
      uuid: 76b193c6-a68e-4d0c-b345-b987a6e7800d
      component_id: js.prose
      inputs:
        body: |-
          <p>Both terminals have a lounge after security. You pay by the hour, so there is no need to arrive early to get your money's worth.</p>
          <h3>Prices</h3>
    -
      parent_uuid: 8315c0ce-fbe6-404e-8c45-15b315413773
      slot: parts
      uuid: 5eb5cccb-70cf-400d-b165-3282602c0602
      component_id: js.data-table
      inputs:
        caption: Prices
        captionHidden: true
        body: |-
          <thead><tr><th scope="col">Time</th><th scope="col">Adult</th><th scope="col">Child (2 to 11)</th><th scope="col">Under 2</th></tr></thead>
          <tbody>
          <tr><th scope="row">First hour</th><td class="table__num">£12</td><td class="table__num">£6</td><td class="table__num">Free</td></tr>
          <tr><th scope="row">Each extra hour</th><td class="table__num">£5</td><td class="table__num">£3</td><td class="table__num">Free</td></tr>
          <tr><th scope="row">Up to 3 hours</th><td class="table__num">£22</td><td class="table__num">£12</td><td class="table__num">Free</td></tr>
          </tbody>
    -
      parent_uuid: 8315c0ce-fbe6-404e-8c45-15b315413773
      slot: parts
      uuid: 3606db8a-c496-45e5-83ac-b9f431de2b27
      component_id: js.prose
      inputs:
        body: |-
          <p>Book online to guarantee a seat, or walk in if there is space. Pay at the desk when you leave.</p>
          <h3>What is included</h3>
          <ul><li>Hot breakfast until 11:00, then soup, salads and hot dishes</li><li>Tea, coffee, soft drinks, beer and wine</li><li>Fast wifi, charging at every seat and flight screens</li><li>Newspapers and magazines</li></ul>
          <h3>The Meridian Lounge, Terminal 1</h3>
          <p>Open 04:00–21:00. Upstairs from the departure lounge, near gate 6. Lift access. Two shower rooms and eight work desks.</p>
          <h3>Horizon Lounge, Terminal 2</h3>
          <p>Open 04:30–21:30. Next to gate 22. A quiet room, a family area with games, three shower rooms and ten work desks.</p>
    -
