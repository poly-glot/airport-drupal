      uuid: 264dbd5d-7f98-4d65-be74-e28881e0b1a9
      component_id: js.prose
      inputs:
        body: |-
          <p>The terminals stay open 24 hours. If you have an early flight, you can wait in the check-in hall overnight. Security opens at 03:30. There are no beds in the terminals, but the Quiet Rooms are open all night.</p>
          <p><button class="button button--secondary" type="button" disabled="">Book a lounge<span class="visually-hidden"> (not available in this demonstration)</span></button></p>
