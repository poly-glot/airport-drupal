      component_id: js.prose
      inputs:
        body: |-
          <h2 id="what-cookies-are-title">What cookies are</h2>
          <p>Cookies are small files that a website saves in your browser. Some are needed for a site to work. Others track what you do, often for advertising. We only use the first kind, and only one of them.</p>
    -
