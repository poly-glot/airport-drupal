      component_id: js.prose
      inputs:
        body: |-
          <h2 id="cookies-we-do-not-use-title">Cookies we do not use</h2>
          <ul><li>No analytics or statistics cookies</li><li>No advertising or retargeting cookies</li><li>No social media cookies</li><li>No cookies from any other company</li></ul>
          <p>The social media links in our footer are plain links. Nothing from those services loads on our pages.</p>
    -
