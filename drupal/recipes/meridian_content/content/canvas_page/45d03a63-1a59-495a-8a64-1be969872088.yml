      component_id: js.prose
      inputs:
        body: |-
          <h2 id="the-cookie-we-use-title">The cookie we use</h2>
          <p>This site sets one cookie at most, and only when you open a page with a form. It protects the form from being submitted by another website pretending to be you.</p>
    -
      parent_uuid: 27892566-b471-4123-8aa6-3eaf7904158e
      slot: parts
      uuid: 13428ee2-bfbb-4375-b232-943f194d7bd8
      component_id: js.data-table
      inputs:
        caption: 'Cookies set by this website'
        body: |-
          <thead><tr><th scope="col">Name</th><th scope="col">Purpose</th><th scope="col">Contains</th><th scope="col">Expires</th></tr></thead>
          <tbody>
          <tr><th scope="row">mer_form</th><td>Protects forms from forged submissions</td><td>A random code. No personal information.</td><td>When you close your browser</td></tr>
          </tbody>
    -
      parent_uuid: 27892566-b471-4123-8aa6-3eaf7904158e
      slot: parts
      uuid: 160a51b2-8d38-4fa3-9d05-62218b60299a
      component_id: js.prose
      inputs:
        body: '<p>Because this cookie is strictly necessary for the form to work safely, we do not ask for your consent and there is no cookie banner. Pages without a form set no cookies at all.</p>'
    -
