      inputs:
        caption: 'Terminal 1, before security'
        captionHidden: true
        body: |-
          <thead><tr><th scope="col">Venue</th><th scope="col">Open</th><th scope="col">What it serves</th></tr></thead>
          <tbody>
          <tr><th scope="row">The Copper Kettle</th><td>04:00–22:00</td><td>Tea, coffee and bacon rolls by the arrivals doors. A good place to meet people off a flight.</td></tr>
          <tr><th scope="row">Platform Seven Bakery</th><td>05:00–20:00</td><td>Fresh bread, pastries and sandwiches at the top of the station escalators.</td></tr>
          </tbody>
    -
