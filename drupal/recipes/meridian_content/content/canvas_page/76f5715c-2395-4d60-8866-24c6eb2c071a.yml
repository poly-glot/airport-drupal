        captionHidden: true
        body: |-
          <thead><tr><th scope="col">Venue</th><th scope="col">Open</th><th scope="col">What it serves</th></tr></thead>
          <tbody>
          <tr><th scope="row">Skyline Kitchen</th><td>04:30–21:00</td><td>Full breakfasts until 11:30, then hot plates and salads. Table service with views of the runway.</td></tr>
          <tr><th scope="row">Runway Noodle Bar</th><td>10:00–21:30</td><td>Ramen, rice bowls and dumplings, cooked to order in about 8 minutes.</td></tr>
          </tbody>
