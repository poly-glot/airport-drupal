      component_id: js.prose
      inputs:
        body: |-
          <h2 id="our-community-title">Our community</h2>
          <p>The Meridian Community Fund gave £420,000 to 63 local groups in 2025, with priority for projects within 10 kilometres of the airport. Applications for 2027 open on 1 February 2027.</p>
