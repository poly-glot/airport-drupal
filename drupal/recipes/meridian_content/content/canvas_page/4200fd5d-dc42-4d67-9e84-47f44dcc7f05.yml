        body: '<h2 id="our-targets-title">Our targets</h2>'
    -
      parent_uuid: 039b5b61-93dd-4b03-9fec-fd5f4e6c9f2a
      slot: parts
      uuid: b9d26f5f-552b-48d4-8950-d1017cda6133
      component_id: js.data-table
      inputs:
        caption: 'Sustainability targets'
        body: |-
          <thead><tr><th scope="col">Target</th><th scope="col">By</th><th scope="col">Where we are now</th></tr></thead>
          <tbody>
          <tr><th scope="row">Renewable electricity for the whole airport</th><td>2024</td><td>Done</td></tr>
          <tr><th scope="row">Net zero carbon from our own operations</th><td>2035</td><td>Down 46% on 2019</td></tr>
          <tr><th scope="row">Half of passengers arriving by public transport</th><td>2030</td><td>51% in 2025</td></tr>
          <tr><th scope="row">Zero waste to landfill</th><td>2027</td><td>3% to landfill in 2025</td></tr>
          <tr><th scope="row">Cut water use per passenger by a third</th><td>2030</td><td>Down 21% on 2019</td></tr>
          </tbody>
    -
      parent_uuid: 039b5b61-93dd-4b03-9fec-fd5f4e6c9f2a
      slot: parts
      uuid: a4d64309-db09-4698-b8f4-cc7db7da4084
      component_id: js.prose
      inputs:
        body: '<p>Our own operations means the buildings, vehicles and equipment we run. It does not include emissions from aircraft, which we cannot control directly, but we report them every year.</p>'
    -
      uuid: 527a4375-f683-4082-8942-1758c33350f3
      component_id: js.section
      inputs:
        anchor: carbon
        tone: light
