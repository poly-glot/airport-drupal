        headingLevel: h2
    -
      parent_uuid: 527a4375-f683-4082-8942-1758c33350f3
      slot: parts
      uuid: 5ee6a302-b511-49eb-9764-d1c9f4ea482d
      component_id: js.prose
      inputs:
        body: |-
          <h2 id="carbon-title">Carbon</h2>
          <h3>What we have done</h3>
          <ul><li>All our electricity has come from renewable sources since 2024, including solar canopies over part of the Mid-Stay car park.</li><li>Two thirds of our airside vehicles are now electric. The rest will be replaced by 2030.</li><li>Every stand has electric ground power, so aircraft do not need to run their engines while parked.</li></ul>
          <h3>What comes next</h3>
          <p>We are replacing the gas boilers in Terminal 1 with heat pumps, starting in 2027. That is our largest remaining source of carbon.</p>
    -
      uuid: 09c999af-48d6-483c-aec6-32868835e9ef
      component_id: js.section
      inputs:
        anchor: getting-here-by-train-and-bus
        tone: light
        tag: section
        labelledBy: getting-here-by-train-and-bus-title
        headingLevel: h2
    -
      parent_uuid: 09c999af-48d6-483c-aec6-32868835e9ef
      slot: parts
      uuid: a659976a-1617-49eb-9e3c-e92609f1d401
      component_id: js.prose
      inputs:
        body: |-
          <h2 id="getting-here-by-train-and-bus-title">Getting here by train and bus</h2>
          <p>The railway station under Terminal 1 is the main reason half our passengers arrive by public transport. Staff get half-price rail travel, and the Meridian Link bus runs every 20 minutes to the city centre. We are pushing for later trains so that passengers on night arrivals have an option other than a car.</p>
    -
      uuid: 00943ea4-a167-459f-a37e-182d205b95b9
      component_id: js.section
      inputs:
        anchor: electric-vehicles
        tone: light
        tag: section
        labelledBy: electric-vehicles-title
        headingLevel: h2
    -
      parent_uuid: 00943ea4-a167-459f-a37e-182d205b95b9
      slot: parts
      uuid: c4d4b231-cb12-4d97-82a2-4faab93b00ba
      component_id: js.prose
      inputs:
        body: |-
          <h2 id="electric-vehicles-title">Electric vehicles</h2>
          <p>There are 166 charging bays across P1, P2 and Mid-Stay, powered by renewable electricity.</p>
          <p><a href="/parking">Parking and charging</a></p>
    -
      uuid: 3267dae8-9b36-4aac-bce3-0961e0200784
      component_id: js.section
      inputs:
        anchor: noise
        tone: light
        tag: section
        labelledBy: noise-title
        headingLevel: h2
    -
      parent_uuid: 3267dae8-9b36-4aac-bce3-0961e0200784
      slot: parts
      uuid: 212c36d6-5464-421c-acd1-14aeea46d9cf
      component_id: js.prose
      inputs:
        body: |-
          <h2 id="noise-title">Noise</h2>
          <ul><li>No scheduled departures between 23:30 and 06:00.</li><li>Free insulation for homes under the flight path. 1,840 homes have been insulated since the scheme began.</li><li>A monthly noise report, with every complaint and our reply.</li></ul>
          <p>To report noise, call <a href="tel:+441214960123">0121 496 0123</a> or email <a href="mailto:hello@meridianairport.example">hello@meridianairport.example</a>. Tell us the date, the time and where you were.</p>
    -
      uuid: 783dcc18-f603-48a0-a5f5-045470a2202e
      component_id: js.section
      inputs:
        anchor: waste-and-water
        tone: light
        tag: section
        labelledBy: waste-and-water-title
        headingLevel: h2
    -
      parent_uuid: 783dcc18-f603-48a0-a5f5-045470a2202e
      slot: parts
      uuid: 35908cb5-1956-4f6b-87b1-9dfe3ca8ca6f
      component_id: js.prose
      inputs:
        body: |-
          <h2 id="waste-and-water-title">Waste and water</h2>
          <p>Every bin in the terminals has a separate slot for recycling, and liquids poured away at security are collected separately. Rainwater from the terminal roofs flushes the toilets in Terminal 2. Free water refill points after security mean fewer plastic bottles.</p>
    -
      uuid: f701ca20-e9b1-46f9-9a2e-6d47076a5236
