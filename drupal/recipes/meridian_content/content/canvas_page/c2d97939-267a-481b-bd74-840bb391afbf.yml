      slot: parts
      uuid: 5d49b658-923a-4696-998f-edbed8bb0e87
      component_id: js.prose
      inputs:
        body: |-
          <ul>
          <li>Closes 10:20: the gate closes at this time. Be there before it.</li>
          <li>New time 10:58 · fog: the flight is delayed to the new time, and why.</li>
          <li>Gate at 10:10: the gate will show at this time.</li>
          <li>Rebook at desk 14 or in app: the flight is cancelled. Your airline will rebook you at that desk or in its app.</li>
          <li>Exit: Arrivals A: meet your passenger at this exit.</li>
          <li>Expected 10:40: the delayed flight is now due at this time.</li>
          </ul>
