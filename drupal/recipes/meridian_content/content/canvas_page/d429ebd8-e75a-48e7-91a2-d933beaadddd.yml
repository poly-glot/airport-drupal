      inputs:
        text: Eat
        level: h2
        id: eat-title
        size: sm
    -
      parent_uuid: 167a9916-117f-42de-bda3-6ae20b268531
      slot: parts
      uuid: ab89b543-7b32-4af2-ab97-977e3aa869a6
      component_id: js.prose
      inputs:
        body: |-
          <ul><li><strong>Lamb soup.</strong> Slow-cooked with root vegetables. Warming after a cold night outside.</li><li><strong>Fish.</strong> Cod, haddock and Arctic char, landed that morning. Look for the fish of the day.</li><li><strong>Skyr.</strong> A thick, mild dairy food, eaten for breakfast or pudding.</li><li><strong>Hot dogs.</strong> A national snack, with crispy onions and sweet mustard. The cheapest hot meal in town.</li></ul>
          <p>Eating out is expensive. Expect around £30 for a main course. Supermarkets and bakeries keep costs down at lunchtime.</p>
    -
