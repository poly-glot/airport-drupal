      uuid: 9ca678e6-4812-4bd9-9fcb-2ff7e44c072e
      component_id: js.heading
      inputs:
        text: 'What to pack'
        level: h2
        id: what-to-pack-title
        size: sm
    -
      parent_uuid: 0272c516-e9fd-44e0-980c-f797fa42b5c3
      slot: parts
      uuid: 62a2acfa-e4bc-4f8f-a654-b8363c57f75a
      component_id: js.prose
      inputs:
        body: '<ul><li>Warm layers, a waterproof outer layer, a hat and gloves. It can feel far colder than the thermometer says.</li><li>Boots with grip. Pavements can be icy from November.</li><li>A swimsuit for the pools.</li><li>A phone tripod. Most phones take good aurora photos on a 3 to 10 second exposure.</li></ul>'
    -
