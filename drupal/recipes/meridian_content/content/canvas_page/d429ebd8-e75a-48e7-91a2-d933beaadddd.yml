    -
      parent_uuid: e207f898-f853-443a-ae5c-ecaaa54cb23f
      slot: parts
      uuid: ca4526ff-9810-418a-9a28-016ebfbb48f9
      component_id: js.prose
      inputs:
        body: |-
          <ul><li>Iceland uses the króna. Cards are accepted everywhere, even for a coffee, so you may not need cash at all.</li><li>Tap water is excellent. Do not buy bottled.</li><li>Weather changes fast. Check road conditions before any drive outside the city.</li></ul>
          <p><a href="/flights">Check Reykjavík flights</a></p>
          <p><a href="/flights/alerts">Set up flight alerts</a></p>
