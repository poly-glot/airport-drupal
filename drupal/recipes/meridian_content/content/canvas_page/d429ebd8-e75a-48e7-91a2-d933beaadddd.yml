      uuid: e10d8c88-b558-4b9a-a5e1-71981f8e73de
      component_id: js.prose
      inputs:
        body: |-
          <p>Nordvik flies to Reykjavík every day from Terminal 2. NV 118 leaves at 10:20 and takes about 3 hours 10 minutes. Iceland stays on GMT all year, so it is one hour behind the UK in summer and on the same time in winter.</p>
          <p>The international airport is about 50 kilometres from the city. Airport buses meet every flight and take around 45 minutes to the city bus terminal, with connections to most hotels. Book the bus online before you fly, as it is cheaper than buying on arrival.</p>
    -
      uuid: f8d07eac-5d87-4996-a8c3-20ba6c158211
