      component_id: js.heading
      inputs:
        text: 'When to go'
        level: h2
        id: when-to-go-title
        size: sm
    -
      parent_uuid: e64cadc5-c231-4327-ae67-59b08520d0ae
      slot: parts
      uuid: 8b4bd816-be27-4305-b234-09bd5d3a36fb
      component_id: js.prose
      inputs:
        body: |-
          <p>The northern lights appear from early September to early April, when the nights are dark enough. You need three things: darkness, a clear sky and some activity from the sun. You can control only the first.</p>
          <ul><li>Look between 21:00 and 02:00.</li><li>Check the cloud forecast as well as the aurora forecast. Clear sky matters more.</li><li>Plan at least three nights. One night is a gamble.</li></ul>
    -
