      uuid: 27ea32e0-cc82-4333-aef9-6f3f03e77ae6
      component_id: js.prose
      inputs:
        body: '<ul><li><strong>The geothermal pools.</strong> Every neighbourhood has a public outdoor pool fed by hot springs, open into the evening and much cheaper than the famous spas. Shower without your swimwear before you go in. It is the rule.</li><li><strong>The big church.</strong> The tall concrete church at the top of the main shopping street has a lift to a viewing platform over the whole city.</li><li><strong>The harbour.</strong> Walk the old harbour and the glass concert hall at sunset.</li></ul>'
    -
