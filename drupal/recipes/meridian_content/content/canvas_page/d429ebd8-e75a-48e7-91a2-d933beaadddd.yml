      uuid: 814313a7-74e9-4310-84bd-39c000e40676
      component_id: js.heading
      inputs:
        text: 'How far you need to go'
        level: h2
        id: how-far-you-need-to-go-title
        size: sm
    -
      parent_uuid: 57aae71c-7203-4703-a4d4-76c47e68b76b
      slot: parts
      uuid: f7fcc337-87ae-4679-b671-11d59c0d3543
      component_id: js.prose
      inputs:
        body: '<p>City lights wash out faint displays, but strong ones are visible from Reykjavík itself, especially from the shore. For better odds, drive 20 to 30 minutes out of town, away from street lights. The national park at Þingvellir, about 45 minutes east, is dark, open and a classic spot. If you do not want to drive on icy roads at night, an organised minibus tour will take you to wherever the sky is clearest that evening.</p>'
    -
