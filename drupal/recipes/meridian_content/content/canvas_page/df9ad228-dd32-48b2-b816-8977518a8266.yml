      component_id: js.prose
      inputs:
        body: |-
          <ol>
          <li>Enter your flight number and date.</li>
          <li>Choose text message or WhatsApp, and the alerts you want.</li>
          <li>We send a short test message to confirm.</li>
          <li>You get an alert each time something changes, until 2 hours after your flight leaves or lands.</li>
          </ol>
          <p>Alerts are free. We only use your number for alerts about the flight you choose, and we delete it 2 hours after the flight.</p>
