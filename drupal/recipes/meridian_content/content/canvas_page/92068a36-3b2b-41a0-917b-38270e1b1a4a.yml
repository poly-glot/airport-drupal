      inputs:
        body: |-
          <h2 id="working-at-meridian-title">Working at Meridian</h2>
          <h3>Shifts that fit</h3>
          <p>The airport runs 24 hours, so many roles are shift-based. We publish rotas 6 weeks ahead and you can swap shifts with colleagues through the staff app.</p>
          <h3>Getting to work</h3>
          <p>Free staff parking at Mid-Stay, and half-price rail travel from Birmingham Central for everyone on our payroll.</p>
          <h3>Training</h3>
          <p>Every new starter gets paid training before their first shift. Most of our managers started in frontline roles.</p>
          <h3>Pay and benefits</h3>
          <ul><li>Pay reviewed every April</li><li>25 days' holiday plus bank holidays, rising to 28 with service</li><li>Pension with up to 8% employer contribution</li><li>Free meals on shift in the staff canteen</li></ul>
