      component_id: js.prose
      inputs:
        body: |-
          <h2 id="how-to-apply-title">How to apply</h2>
          <ol><li>Read the full role description and check you meet the requirements.</li><li>Apply online with your CV and a short covering statement. We do not use automated scoring.</li><li>If you are shortlisted, we invite you to an interview at the airport within 2 weeks of the closing date.</li><li>Before you start, we carry out the background checks needed for an airport security pass. This takes 4 to 6 weeks.</li></ol>
