      inputs:
        body: |-
          <ul>
          <li>Your number plate is your ticket. Cameras read it on the way in and out.</li>
          <li>All three car parks are step-free to check-in, with lifts in each one.</li>
          <li>Shuttle buses have a ramp, space for a wheelchair and racks for big cases.</li>
          <li>If your return flight is delayed, the first 2 hours past your booked time are free.</li>
          <li>Height limit in P2 Long-stay is 2.1 metres. Vans and roof boxes should use Mid-Stay.</li>
          </ul>
