      uuid: 51c6c6d1-4536-43f4-bbf7-bf72610748e5
      component_id: js.prose
      inputs:
        body: |-
          <p>Meridian Airport station is directly below Terminal 1. Trains run from Birmingham Central every 10 minutes, from 04:30 until midnight, and take 18 minutes.</p>
          <h3>From the platform to your terminal</h3>
          <ul>
          <li>For Terminal 1, take the lifts or escalators up one level. You arrive next to check-in zone A.</li>
          <li>For Terminal 2, go up to Terminal 1 and follow signs for the covered walkway. It is a 5-minute walk, step-free all the way.</li>
          </ul>
          <h3>Tickets</h3>
          <p>Buy your ticket before you board, from the station machines or online. Ask for "Meridian Airport" as your destination. Station staff are on hand from the first train to the last, and can arrange help for anyone who needs it.</p>
