      component_id: js.prose
      inputs:
        body: |-
          <h3>Local buses</h3>
          <p>The Meridian Link bus runs between the city centre and both terminals every 20 minutes, from 05:00 to 23:30. The journey takes about 35 minutes. Stops are outside the arrivals halls. Pay the driver by card or phone.</p>
          <h3>Coaches</h3>
          <p>The coach station is next to Terminal 2, with direct coaches to towns and cities across the country. Book with the coach operator. The coach station has a waiting room, toilets and a ticket machine, open from 04:00 to midnight.</p>
