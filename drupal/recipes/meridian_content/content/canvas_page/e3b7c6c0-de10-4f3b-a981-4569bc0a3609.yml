    -
      parent_uuid: 49db1e31-dd8b-4c88-9e0c-2f7adece2124
      slot: parts
      uuid: 193a76f8-f79e-413a-bf6d-69b73e368a4c
      component_id: js.prose
      inputs:
        body: |-
          <p>Follow signs for Meridian Airport from the A45. For sat-nav, use B99 1MA, then follow the road signs for Terminal 1 or Terminal 2.</p>
          <p>Lane closures on the A45 approach are in place until 12 October. Allow an extra 15 minutes to reach Terminal 2.</p>
          <h3>Drop-off</h3>
          <p>Drop-off zones are outside both terminals. They cost £3 for up to 10 minutes. For free drop-off, use the 10-minute zone at the Mid-Stay car park and take the shuttle bus to the terminal.</p>
          <h3>Pick-up</h3>
          <p>Park in P1 Short-stay for a quick pick-up, from £4 an hour. Or wait for free for 10 minutes at Mid-Stay.</p>
          <h3>Taxis</h3>
          <p>There are taxi ranks outside the arrivals halls of both terminals, open 24 hours. Pre-booked taxis and private hire cars pick up from level 0 of P2 Long-stay.</p>
