      uuid: 2a9efc84-9e7c-4496-ac35-2d6c02ad7de4
      component_id: js.prose
      inputs:
        body: |-
          <h2 id="through-security-title">Through security</h2>
          <p>Both terminals have a family lane at security for anyone travelling with children under 12. It is wider, staff will help with trays, and nobody will hurry you.</p>
          <p>You can take enough baby food, milk and sterilised water for the journey, even above the normal liquids limit. You may be asked to taste it or open it for a test.</p>
          <p><a href="/at-the-airport/security">Security and customs</a></p>
    -
      uuid: a8a490b0-f62b-47d5-b452-3a3639287ebc
      component_id: js.section
      inputs:
        anchor: prams-and-pushchairs
        tone: light
        tag: section
        labelledBy: prams-and-pushchairs-title
        headingLevel: h2
    -
      parent_uuid: a8a490b0-f62b-47d5-b452-3a3639287ebc
      slot: parts
      uuid: 6b0a8096-31cf-4bca-8a41-bdbcb96cf5cf
      component_id: js.prose
      inputs:
        body: |-
          <h2 id="prams-and-pushchairs-title">Prams and pushchairs</h2>
          <p>Keep your pram or pushchair all the way to the aircraft door. Leave it at the foot of the steps or the end of the air bridge with a gate tag, and the crew will load it. When you land, it is waiting for you at the aircraft door, not on the baggage belt. Pushchairs and car seats travel free on all four of our airlines.</p>
    -
      uuid: 3ee6346e-3afb-4650-b1aa-a6ca4084ca21
      component_id: js.section
      inputs:
        anchor: baby-change-and-feeding
        tone: light
        tag: section
        labelledBy: baby-change-and-feeding-title
        headingLevel: h2
    -
      parent_uuid: 3ee6346e-3afb-4650-b1aa-a6ca4084ca21
      slot: parts
      uuid: 2d8e674c-97b7-41bd-bc92-3a07f599b961
      component_id: js.prose
      inputs:
        body: |-
          <h2 id="baby-change-and-feeding-title">Baby-change and feeding</h2>
          <p>There is baby-change in every toilet zone, before and after security, in both terminals. Quiet feeding rooms with a comfortable chair, a sink and a bottle warmer are next to each play area. Every café will warm milk or baby food if you ask.</p>
    -
      uuid: a4484d23-d2b8-4098-b18f-b24c26dfec1a
      component_id: js.section
      inputs:
        anchor: play-areas
        tone: light
        tag: section
        labelledBy: play-areas-title
        headingLevel: h2
    -
      parent_uuid: a4484d23-d2b8-4098-b18f-b24c26dfec1a
      slot: parts
      uuid: 3fdffcca-002e-4767-842f-eea015c3f3b0
      component_id: js.prose
      inputs:
        body: |-
          <h2 id="play-areas-title">Play areas</h2>
          <p>There are free play areas by gate 12 in Terminal 1 and gate 30 in Terminal 2, with soft flooring and seating for parents in view of the departure screens. The Horizon Lounge in Terminal 2 also has a family area with games.</p>
    -
      uuid: 751dd2f1-88d4-4aac-90ba-196130c53de8
      component_id: js.section
      inputs:
        anchor: tickets-and-passports
        tone: light
        tag: section
        labelledBy: tickets-and-passports-title
        headingLevel: h2
    -
      parent_uuid: 751dd2f1-88d4-4aac-90ba-196130c53de8
      slot: parts
      uuid: acd05fd5-8166-46b9-8b23-e98967a09ec7
      component_id: js.prose
      inputs:
        body: |-
          <h2 id="tickets-and-passports-title">Tickets and passports</h2>
          <p>Every child needs their own passport, including babies. Children under 2 usually fly on an adult's lap, and airlines set their own child fares and seat rules, so check your booking.</p>
    -
      uuid: 43ccec87-e138-4a34-8704-340a74edfd52
      component_id: js.section
      inputs:
        anchor: flying-while-pregnant
        tone: light
