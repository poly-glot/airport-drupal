        headingLevel: h2
    -
      parent_uuid: 43ccec87-e138-4a34-8704-340a74edfd52
      slot: parts
      uuid: 87ddb3a1-3860-4341-93fc-66125a2284c7
      component_id: js.prose
      inputs:
        body: |-
          <h2 id="flying-while-pregnant-title">Flying while pregnant</h2>
          <p>Each airline sets its own rules. Most ask for a letter from your doctor or midwife after 28 weeks, and many will not fly you after 36 weeks, or 32 weeks if you are expecting more than one baby. Check with your airline before you book.</p>
    -
