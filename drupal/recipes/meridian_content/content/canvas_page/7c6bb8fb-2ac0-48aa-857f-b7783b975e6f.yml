      inputs:
        body: |-
          <h2 id="who-we-are-title">Who we are</h2>
          <p>Meridian Airport opened in 1971 as a single terminal beside a new railway line. Terminal 2 followed in 2009. Today we handle around 6.4 million passengers a year, most of them on short flights to Europe and North Africa.</p>
          <p>Meridian Airport Ltd owns and runs the airport. We look after the runway, the terminals, security, the car parks and the shops and restaurants. Airlines run their own flights, check-in and baggage handling.</p>
    -
      uuid: 2d9537ec-50cf-4016-aeba-789a6945bd13
      component_id: js.section
      inputs:
        anchor: what-we-are-working-on
        tone: light
        tag: section
        labelledBy: what-we-are-working-on-title
        headingLevel: h2
    -
      parent_uuid: 2d9537ec-50cf-4016-aeba-789a6945bd13
      slot: parts
      uuid: 09212eac-b718-4ce7-9b15-9607e369f1b5
      component_id: js.prose
      inputs:
        body: |-
          <h2 id="what-we-are-working-on-title">What we are working on</h2>
          <h3>Shorter queues at security</h3>
          <p>New scanners opened in all six Terminal 1 lanes on 1 October 2026. Average waits fell from 14 minutes to 8 in the first week. Terminal 2's lanes will be replaced by spring 2027.</p>
          <h3>Easier journeys by rail</h3>
          <p>Half of our passengers already arrive by public transport. We are working with the rail industry on later trains, so that passengers on the last arrivals of the night can get home without a car.</p>
          <h3>A quieter, cleaner airport</h3>
          <p>We have run on renewable electricity since 2024 and have a plan to reach net zero for our own operations by 2035.</p>
          <p><a href="/about/sustainability">Sustainability</a></p>
    -
      uuid: 1c9d9410-37bd-42f6-b6c8-e1db6e77aad5
