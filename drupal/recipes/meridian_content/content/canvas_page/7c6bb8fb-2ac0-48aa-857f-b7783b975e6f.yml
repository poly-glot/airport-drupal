        body: |-
          <h2 id="our-neighbours-title">Our neighbours</h2>
          <p>Around 40,000 people live within 5 kilometres of the runway. We run a noise insulation scheme for homes under the flight path, publish noise reports every month, and fund local projects through the Meridian Community Fund, which gave £420,000 to 63 groups in 2025.</p>
