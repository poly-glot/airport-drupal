      uuid: 948e832c-dcff-4537-8eb6-79ba9cd12c20
      component_id: js.prose
      inputs:
        body: |-
          <h2 id="how-we-are-run-title">How we are run</h2>
          <p>Meridian Airport Ltd is a private company with a board of seven directors, including two independent members. A Passenger Advisory Panel of 12 regular travellers, including disabled passengers and parents of young children, meets four times a year and reviews every major change to the terminals before it is built.</p>
