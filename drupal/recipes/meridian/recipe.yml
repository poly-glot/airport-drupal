name: Meridian Airport
description: Canvas, OAuth, the Meridian theme as default, and the image and document media types.
type: Site
recipes:
  - ../web/core/recipes/document_media_type
  - ../web/core/recipes/image_media_type
install:
  - canvas
  - canvas_oauth
  - canvas_page_template_component
  - meridian
config:
  actions:
    system.theme:
      simpleConfigUpdate:
        default: meridian
    filter.format.canvas_html_block:
      simpleConfigUpdate:
        filters:
          filter_html:
            id: filter_html
            provider: filter
            status: true
            weight: 0
            settings:
              allowed_html: '<strong> <em> <u> <a href class id> <br> <p class id> <ul class id> <ol class id start> <li class id> <h2 id class> <h3 id class> <h4 id class> <time datetime> <span class> <small> <table class> <thead> <tbody> <tr> <th scope class> <td class> <dl class> <dt class> <dd class> <div class> <svg class width height viewBox fill stroke stroke-width stroke-linecap stroke-linejoin aria-hidden> <path d> <button class type disabled>'
              filter_html_help: false
              filter_html_nofollow: false
