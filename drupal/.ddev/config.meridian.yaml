hooks:
  post-start:
    - exec: grep -q settings.meridian.php web/sites/default/settings.php || printf "\nrequire __DIR__ . '/settings.meridian.php';\n" >> web/sites/default/settings.php
web_environment:
  - REVALIDATE_SECRET=local-revalidate-secret
  - REVALIDATE_URL=http://host.docker.internal:3000
