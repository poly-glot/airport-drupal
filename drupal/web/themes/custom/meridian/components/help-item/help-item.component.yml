$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Help item
status: stable
group: Meridian · Inner pages
description: One ruled row with icon, title and body, as on the homepage help band.
props:
  type: object
  required: [icon, title, href]
  properties:
    icon:
      type: string
      title: Icon
      enum: [assistance, children, first-flight, alerts, lost-property, contact, security, eat-and-drink, shopping, lounges]
      examples: ["assistance"]
    title:
      type: string
      title: Row heading
      examples: ["Special assistance"]
    body:
      type: string
      title: Row text
      examples: ["Help from kerb to gate, step-free routes and sunflower lanyards. Book up to 48 hours before and we confirm within the hour."]
    href:
      type: string
      title: Link
      format: uri-reference
      examples: ["/help/special-assistance"]
