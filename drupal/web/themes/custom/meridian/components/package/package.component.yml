$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Package
status: stable
group: Meridian · Inner pages
description: Priced product card for two to four options, with tick list and bottom-pinned call to action.
props:
  type: object
  required: [tier, price, cta_label, href]
  properties:
    tier:
      type: string
      title: Package name
      examples: [P2 Long-stay]
    price_prefix:
      type: string
      title: Text before the price
      examples: [From]
    price:
      type: string
      title: Price
      examples: [£8.50]
    unit:
      type: string
      title: Text after the price
      examples: [per day]
    badge:
      type: string
      title: Badge above the name
      examples: [Recommended]
    meta:
      type: string
      title: Line under the price
      examples: [5 min walk · covered]
    best_label:
      type: string
      title: Bold start of the best-for line
      examples: [Best for]
    note:
      type: string
      title: Rest of the best-for line
      examples: ["Weekends, short breaks and holidays"]
    recommended:
      type: boolean
      title: Recommended
      examples: [true]
    cta_label:
      type: string
      title: Button text
      examples: [Book P2 Long-stay]
    href:
      type: string
      format: uri-reference
      title: Button link
      examples: ['#quote']
slots:
  features:
    title: Features
    description: Package feature items.
libraryOverrides:
  dependencies:
    - core/components.meridian--button
