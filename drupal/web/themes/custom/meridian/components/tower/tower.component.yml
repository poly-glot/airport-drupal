$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Tower
status: stable
group: Meridian · Parts
description: Tall photo tile with icon, number, title, body and call to action.
props:
  type: object
  required: [number, icon, title, cta_label, href, image_src]
  properties:
    number:
      type: string
      title: Corner number
      examples: ["01"]
    icon:
      type: string
      title: Icon
      enum: [security, eat-and-drink, baggage, maps]
      examples: ["security"]
    title:
      type: string
      title: Tower heading
      examples: ["Security and customs"]
    body:
      type: string
      title: Tower text
      examples: ["New scanners in Terminal 1: liquids and laptops stay in your bag. Arrive two hours before short-haul, three for long-haul."]
    cta_label:
      type: string
      title: Link text at the bottom
      examples: ["What to expect"]
    href:
      type: string
      title: Link
      format: uri-reference
      examples: ["/at-the-airport/security"]
    image_src:
      type: string
      title: Image stem
      description: Image path including the width suffix and no extension.
      examples: ['/assets/img/airport/tower-security-560']
    image_alt:
      type: string
      title: Image alt text
      examples: ['Photograph at Meridian Airport']
    image_width:
      type: integer
      title: Image width
      examples: [560]
    image_height:
      type: integer
      title: Image height
      examples: [840]
