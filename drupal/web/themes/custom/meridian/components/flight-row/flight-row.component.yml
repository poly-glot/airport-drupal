$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Flight row
status: stable
group: Meridian · Parts
description: One row of the live flight board with split-flap cells for time, place, flight, terminal, gate or belt, and status.
props:
  type: object
  required: [time, place, flight, terminal, gate, status]
  properties:
    time:
      type: string
      title: Time
      examples: ['10:05']
    place:
      type: string
      title: Destination or origin
      examples: [Lisbon]
    flight:
      type: string
      title: Flight number
      examples: [MA 204]
    terminal:
      type: string
      title: Terminal
      examples: [T1]
    gate:
      type: string
      title: Gate or belt
      description: Use an em dash when the gate is not shown yet.
      examples: ['12']
    gate_label:
      type: string
      title: Gate spoken label
      description: Spoken text for an em dash gate.
      examples: [Not shown yet]
    status:
      type: string
      title: Status
      enum: [on-time, boarding, gate-open, delayed, cancelled, landed, expected]
      examples: [boarding]
    note:
      type: string
      title: Info column text
      examples: [Closes 10:20]
    tip:
      type: string
      title: Status tip
      description: Hover and focus tip explaining the status.
      examples: [Go to the gate now.]
    tip_id:
      type: string
      title: Status definition id
      description: Id of the status definition the tip is described by.
      examples: [status-boarding]
