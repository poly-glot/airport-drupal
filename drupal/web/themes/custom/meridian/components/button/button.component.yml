$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Button
status: stable
group: Meridian · Parts
description: Primary, secondary and block buttons shared by forms and cards. Link or submit.
props:
  type: object
  required: [label]
  properties:
    label:
      type: string
      title: Button text
      examples: [Check prices and availability]
    href:
      type: string
      format: uri-reference
      title: Link
      examples: [/parking#quote]
    variant:
      type: string
      title: Variant
      enum: [primary, secondary]
      examples: [primary]
    block:
      type: boolean
      title: Full width
      examples: [true]
    large:
      type: boolean
      title: Large
      examples: [false]
