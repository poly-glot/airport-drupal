$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Section head
status: stable
group: Meridian · Parts
description: Section heading with optional intro and a trailing text link, shared by the help and tower bands.
props:
  type: object
  required: [title, title_id]
  properties:
    title:
      type: string
      title: Section heading
      examples: ["Help for the day you fly"]
    intro:
      type: string
      title: Line under the heading
      examples: ["Everything between the door and the gate."]
    heading_level:
      type: string
      title: Heading level
      enum: [h2, h3]
      examples: ["h2"]
    title_id:
      type: string
      title: Heading id
      examples: ["help-title"]
    link_label:
      type: string
      title: Link text on the right
      examples: ["All passenger services"]
    link_href:
      type: string
      title: Link
      format: uri-reference
      examples: ["/help"]
