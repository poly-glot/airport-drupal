$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Status
status: stable
group: Meridian · Parts
description: Square dot and uppercase word naming a flight status, used by the status legend on the flights page.
props:
  type: object
  required: [word]
  properties:
    word:
      type: string
      title: Status word
      examples: [On time]
    tone:
      type: string
      title: Tone
      enum: [ok, info, neutral, warn, bad]
      default: ok
      examples: [ok]
