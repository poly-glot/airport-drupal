$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Wait panel
status: stable
group: Meridian · Bands
description: White panel floating over the bottom edge of the hero with security wait chips and the roads and rail status. Its CSS lives in hero.css.
props:
  type: object
  required: [updated, road_status]
  properties:
    updated:
      type: string
      title: Updated time, after "updated "
      examples: ['09:42']
    road_status:
      type: string
      title: Roads and rail status
      examples: [Running normally]
slots:
  chips:
    title: Chips
    description: Wait chip leaves, one per terminal.
libraryOverrides:
  dependencies: []
