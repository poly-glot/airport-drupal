$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Notice
status: stable
group: Meridian · Parts
description: One travel notice inside the notice bar, with its previous and next controls and the bar link.
props:
  type: object
  required: [kind, text, position, total]
  properties:
    kind:
      type: string
      title: Bold notice kind, before the dot
      examples: [Travel disruption]
    text:
      type: string
      title: Notice text
      examples: [Fog is delaying some morning departures by up to 40 minutes.]
    action:
      type: string
      title: Trailing instruction, after the text
      examples: ['What to do: check your flight below before setting off and allow extra time at security.']
    position:
      type: integer
      title: Position
      description: One based position of this notice in the bar.
      examples: [1]
    total:
      type: integer
      title: Total notices
      examples: [3]
    link_label:
      type: string
      title: Link text on the right
      examples: [Check my flight]
    link_href:
      type: string
      format: uri-reference
      title: Link
      examples: [/flights]
