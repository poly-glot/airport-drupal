$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Fact
status: stable
group: Meridian · Parts
description: One term and value pair inside a facts list.
props:
  type: object
  required: [term, value]
  properties:
    term:
      type: string
      title: Term, left column
      contentMediaType: text/html
      examples: [Terminal]
    value:
      type: string
      title: Definition, right column
      contentMediaType: text/html
      examples: [T1]
    id:
      type: string
      title: Value ID
      examples: [status-on-time]

libraryOverrides:
  dependencies:
    - core/components.meridian--status
