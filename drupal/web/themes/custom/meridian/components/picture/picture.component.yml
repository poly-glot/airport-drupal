$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Picture
status: stable
group: Meridian · Parts
description: Responsive image renderer. Emits AVIF, WebP and JPEG sources from a slot stem, exactly as the static site writes its pictures.
props:
  type: object
  required: [src]
  properties:
    src:
      type: string
      title: Image stem
      description: Image path including the width suffix and no extension.
      examples: ['/assets/img/airport/tower-security-560']
    alt:
      type: string
      title: Image alt text
      examples: ['Photograph at Meridian Airport']
    width:
      type: integer
      title: Image width
      examples: [560]
    height:
      type: integer
      title: Image height
      examples: [840]
    sizes:
      type: string
      title: Sizes
      examples: ['(max-width: 900px) calc(50vw - 22px), 265px']
    widths:
      type: string
      title: Extra srcset widths
      description: Comma separated widths with no spaces, for example 560,840. Empty means only the width in the stem.
      examples: ['560,840']
    loading:
      type: string
      title: Loading
      enum: [lazy, eager]
      default: lazy
      examples: [lazy]
    priority:
      type: boolean
      title: High fetch priority
      default: false
      examples: [false]
    css_class:
      type: string
      title: Image class
      examples: [tower__img]
    picture_class:
      type: string
      title: Picture class
      examples: [tower__media]
