$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Tower grid
status: stable
group: Meridian · Bands
description: Four-up grid of tall photo towers under a section head.
props:
  type: object
  required: [title]
  properties:
    title:
      type: string
      title: Section heading
      examples: ["At the airport"]
    intro:
      type: string
      title: Line under the heading
      examples: ["Everything between the door and the gate."]
    link_label:
      type: string
      title: Link text on the right
      examples: ["Terminal maps"]
    link_href:
      type: string
      title: Link
      format: uri-reference
      examples: ["/at-the-airport#maps"]
    anchor:
      type: string
      title: Anchor id
      examples: ["at-the-airport"]
    title_id:
      type: string
      title: Heading id
      examples: ["airport-title"]
slots:
  towers:
    title: Towers
    description: Tower tiles.
libraryOverrides:
  dependencies:
    - core/components.meridian--section-head
