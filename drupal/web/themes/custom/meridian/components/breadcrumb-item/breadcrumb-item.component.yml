$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Breadcrumb item
status: stable
group: Meridian · Parts
description: One crumb in a breadcrumb trail, a link, or the current page as plain text with aria-current.
props:
  type: object
  required: [label]
  properties:
    label:
      type: string
      title: Crumb text
      examples: [Home]
    href:
      type: string
      format: uri-reference
      title: Link
      examples: [/]
    current:
      type: boolean
      title: Current page
      examples: [false]
