$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Testimonial
status: stable
group: Meridian · Inner pages
description: A passenger quote in a flat white block, with the speaker's name and a line about their journey. Sits in a two or three column group under a section heading.
props:
  type: object
  required: [quote, name]
  properties:
    quote:
      type: string
      title: The quote
      contentMediaType: text/html
      examples: ['<p>Eight minutes through security with a pram, and the family lane staff talked to my daughter, not over her.</p>']
    name:
      type: string
      title: Who said it
      examples: [Priya N.]
    meta:
      type: string
      title: Line under the name, about their journey
      examples: [Flew to Lisbon, October 2026]
