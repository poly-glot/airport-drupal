$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Flight board
status: stable
group: Meridian · Bands
description: Dark split-flap board with Departures and Arrivals folder tabs, search, legend and live updates.
props:
  type: object
  required: [title, title_id, clock_time]
  properties:
    title:
      type: string
      title: Board heading
      examples: [Live flights]
    title_id:
      type: string
      title: Title id
      description: Id of the heading, referenced by aria-labelledby.
      examples: [live-flights-title]
    meta:
      type: string
      title: Line under the heading, after "Updated hh:mm · "
      description: Text after "Updated hh:mm · ".
      examples: [refreshes every minute · gates shown from 60 min before departure]
    clock_time:
      type: string
      title: Clock time
      examples: ['09:42']
    overlapped:
      type: boolean
      title: Overlap the section above
      default: false
      examples: [true]
    show_search:
      type: boolean
      title: Show search
      default: true
      examples: [true]
    departures_search_label:
      type: string
      title: Departures search label
      examples: [Search departures by flight or city]
    arrivals_search_label:
      type: string
      title: Arrivals search label
      examples: [Search arrivals by flight or city]
    departures_caption:
      type: string
      title: Departures table caption
      examples: [Departures]
    arrivals_caption:
      type: string
      title: Arrivals table caption
      examples: [Arrivals]
    all_departures_label:
      type: string
      title: All departures button label
      examples: [All departures]
    all_departures_href:
      type: string
      format: uri-reference
      title: All departures link
      examples: [/flights#departures]
    all_arrivals_label:
      type: string
      title: All arrivals button label
      examples: [All arrivals]
    all_arrivals_href:
      type: string
      format: uri-reference
      title: All arrivals link
      examples: [/flights#arrivals]
slots:
  departures:
    title: Departures
    description: Flight rows for the departures table.
  arrivals:
    title: Arrivals
    description: Flight rows for the arrivals table.
libraryOverrides:
  css:
    component:
      flight-board.css: {}
      tabs.css: {}
  dependencies:
    - core/components.meridian--button
    - core/drupal
    - core/once
  js:
    flight-board.js:
      attributes:
        defer: true
