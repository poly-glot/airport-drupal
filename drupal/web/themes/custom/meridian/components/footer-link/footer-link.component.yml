$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Footer link
status: stable
group: Meridian · Parts
description: One footer link row, used in the four columns and the legal bar.
props:
  type: object
  required: [label, href]
  properties:
    label:
      type: string
      title: Link text
      examples: [Live departures]
    href:
      type: string
      format: uri-reference
      title: Link
      examples: [/flights#departures]
