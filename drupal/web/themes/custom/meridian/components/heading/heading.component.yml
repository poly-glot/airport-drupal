$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Heading
status: stable
group: Meridian · Parts
description: A section title inside a stack, plain or small, with an optional id.
props:
  type: object
  required: [text]
  properties:
    text:
      type: string
      title: Heading text
      examples: [Reading the board]
    level:
      type: string
      title: Level
      enum: [h2, h3, h4]
      examples: [h2]
    size:
      type: string
      title: Size
      enum: [default, sm, card]
      examples: [sm]
    id:
      type: string
      title: Id
      examples: [reading-the-board-title]
libraryOverrides:
  dependencies:
    - core/components.meridian--card
    - core/components.meridian--section-head
