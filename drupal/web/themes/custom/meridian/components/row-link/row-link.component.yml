$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Row link
status: stable
group: Meridian · Inner pages
description: One ruled row with icon, title, meta line and chevron, as in the getting-here list.
props:
  type: object
  required: [title, href]
  properties:
    icon:
      type: string
      title: Icon
      enum: [train, car, bus]
      examples: [train]
    title:
      type: string
      title: Row heading
      examples: [By train]
    meta:
      type: string
      title: Line under the row heading
      examples: [18 min from Central · lifts from platform to check-in]
    href:
      type: string
      format: uri-reference
      title: Link
      examples: [/getting-here#train]
