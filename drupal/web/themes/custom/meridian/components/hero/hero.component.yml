$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Hero
status: stable
group: Meridian · Bands
description: Full-bleed sky hero with weather block, title, intro, quick-link signs, the flight search card and the security wait panel floating over its bottom edge.
props:
  type: object
  required: [title, intro]
  properties:
    title:
      type: string
      title: Welcome heading
      examples: [Welcome to Meridian Airport]
    intro:
      type: string
      title: Line under the heading
      examples: [Your gateway to 112 destinations. Check your flight, pre-book parking and reserve duty free to collect at the gate.]
    default_weather:
      type: string
      title: Default weather
      enum: [sunny, cloudy, rainy]
      default: rainy
      examples: [rainy]
slots:
  signs:
    title: Signs
    description: Hero sign leaves, the quick links under the intro.
  aside:
    title: Aside
    description: The white search card (form kind flight-search).
  wait:
    title: Wait panel
    description: The wait panel that floats over the bottom edge of the hero.
libraryOverrides:
  dependencies:
    - core/drupal
    - core/once
  js:
    hero.js:
      attributes:
        defer: true
