$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Prose
status: stable
group: Meridian · Inner pages
description: Running text under a serif heading, set to the 720px reading measure.
props:
  type: object
  required: [body]
  properties:
    body:
      type: string
      title: Body copy
      contentMediaType: text/html
      examples: ['<p>The airport runs 24 hours, so many roles are shift-based. We publish rotas 6 weeks ahead and you can swap shifts with colleagues through the staff app.</p>']
