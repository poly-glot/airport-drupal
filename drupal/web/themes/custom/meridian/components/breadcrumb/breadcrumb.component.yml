$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Breadcrumb
status: stable
group: Meridian · Inner pages
description: Breadcrumb trail above an inner page title, or on a photo band in its on-dark colours.
props:
  type: object
  properties:
    on_dark:
      type: boolean
      title: On dark
      examples: [false]
slots:
  items:
    title: Items
    description: One breadcrumb item per crumb, the last one current.
