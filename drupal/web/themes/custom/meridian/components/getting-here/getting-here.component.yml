$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Getting here
status: stable
group: Meridian · Bands
description: Panel band with route rows and a step-free note beside a full-height map pane.
props:
  type: object
  required: [title, intro]
  properties:
    title:
      type: string
      title: Section heading
      examples: ["Getting here"]
    intro:
      type: string
      title: Line under the heading
      examples: ["Trains from the city centre run every 10 minutes and stop under Terminal 1. Drop-off is outside both terminals, with a free 10-minute wait at Mid-Stay."]
    note_lead:
      type: string
      title: Bold start of the note
      examples: ["Step-free throughout."]
    note:
      type: string
      title: Rest of the note
      examples: ["Lifts at the station, every car park and both terminals. Prams go all the way to the aircraft door."]
    note_icon:
      type: string
      title: Note icon
      enum: [step-free]
      examples: ["step-free"]
    anchor:
      type: string
      title: Anchor id
      examples: ["getting-here"]
    title_id:
      type: string
      title: Heading id
      examples: ["getting-here-title"]
slots:
  rows:
    title: Rows
    description: Row links, each rendering its own list item.
  map:
    title: Map
    description: The map pane.
libraryOverrides:
  dependencies:
    - core/components.meridian--section-head
