$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Photo band
status: stable
group: Meridian · Bands
description: Full-bleed photo band with copy, stats and an aside form; the homepage parking band and the parking page hero.
props:
  type: object
  required: [title, image_src]
  properties:
    title:
      type: string
      title: Band heading
      examples: ["Park at the terminal from £8.50 a day"]
    intro:
      type: string
      title: Line under the heading
      examples: ["Three car parks, all step-free to check-in. Pre-booked rates are up to 40% below drive-up, with free cancellation until 24 hours before you arrive."]
    image_src:
      type: string
      title: Image stem
      description: Image path including the width suffix and no extension.
      examples: ['/assets/img/home/parking-1440']
    image_alt:
      type: string
      title: Image alt text
      examples: ['Photograph at Meridian Airport']
    image_width:
      type: integer
      title: Image width
      examples: [1440]
    image_height:
      type: integer
      title: Image height
      examples: [810]
    variant:
      type: string
      title: Variant
      enum: [band, hero]
      examples: ["band"]
    heading_level:
      type: string
      title: Heading level
      enum: [h1, h2]
      examples: ["h2"]
    anchor:
      type: string
      title: Anchor id
      examples: ["parking"]
    title_id:
      type: string
      title: Heading id
      examples: ["parking-title"]
    link_label:
      type: string
      title: Link text
      examples: ["Compare all car parks and the map"]
    link_href:
      type: string
      title: Link
      format: uri-reference
      examples: ["/parking#compare"]
slots:
  breadcrumb:
    title: Breadcrumb
    description: Breadcrumb trail, used by the hero variant above the heading.
  facts:
    title: Facts
    description: Stat leaves rendered inside the stats list.
  aside:
    title: Aside
    description: The parking form card.
libraryOverrides:
  dependencies:
    - core/components.meridian--section-head
    - core/components.meridian--stat
