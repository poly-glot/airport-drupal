name: Verify

on:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next
    env:
      CANVAS_SITE_URL: http://localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: next/package-lock.json
          node-version: '24'
      - run: npm ci
      - run: npm run check
      - run: npm run build

  drupal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: composer validate --working-dir=drupal --no-check-publish
      - run: composer install --working-dir=drupal --no-interaction --no-progress
      - run: composer quality --working-dir=drupal
