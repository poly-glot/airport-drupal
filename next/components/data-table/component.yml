name: Data table
machineName: data-table
status: true
required:
    - body
props:
    properties:
        caption:
            title: Table caption
            type: string
            examples:
                - Car parks at a glance
        captionHidden:
            title: Caption hidden
            type: boolean
            examples:
                - false
        body:
            title: Table rows
            type: string
            contentMediaType: text/html
            examples:
                - '<thead><tr><th scope="col">Car park</th><th scope="col">To the terminal</th><th scope="col">From</th><th scope="col">Covered</th><th scope="col">Electric charging</th></tr></thead><tbody><tr><th scope="row">P1 Short-stay</th><td>2 min walk</td><td class="table__num">£4 per hour</td><td>Walkway only</td><td>6 bays</td></tr><tr><th scope="row">P2 Long-stay</th><td>5 min walk</td><td class="table__num">£8.50 per day</td><td>Yes</td><td>40 bays</td></tr></tbody>'
